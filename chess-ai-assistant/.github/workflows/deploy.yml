# Builds Chess AI Arena and publishes it to GitHub Pages.
#
# One-time setup in the repository:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# The site is then served from https://<your-username>.github.io/<repository>/
# and `vite.config.ts` uses the matching base path (default /chess-ai-assistant/).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow a single concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Derive the base path from the repository name
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "Using VITE_BASE=/${REPO_NAME}/"
          echo "VITE_BASE=/${REPO_NAME}/" >> "$GITHUB_ENV"

      - name: Build production bundle
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
